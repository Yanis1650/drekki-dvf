name: Basic Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # Les tests couvrent les endpoints HTTP en plus des unitaires : c'est ce
      # qui manquait quand la fiche parcelle renvoyait 500 sans que rien
      # ne le signale.
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      # Tailwind ignore silencieusement une classe inconnue : un `text-slate-500`
      # oublié ne casserait rien et la charte fondrait sans bruit. Ce contrôle
      # échoue à sa place. Voir docs/CHARTE_GRAPHIQUE.md
      - name: Check Design Charter
        working-directory: frontend
        run: npm run check:charte

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
