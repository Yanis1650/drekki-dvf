name: DVF source check

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvf-source-check
  cancel-in-progress: false

jobs:
  probe:
    name: data.gouv metadata probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the minimal client
        run: python -m pip install --upgrade pip requests
      - name: Verify current DVF publication without downloading data
        run: |
          set -o pipefail
          python data-pipeline/run_dvf_ingestion.py --dry-run | tee "$RUNNER_TEMP/dvf-source-check.log"
          release="$(sed -n 's/^release=\([^ ]*\).*/\1/p' "$RUNNER_TEMP/dvf-source-check.log")"
          test -n "$release"
          {
            echo "## Source DVF"
            echo
            echo "- Publication détectée : \`$release\`"
            echo "- Mode : métadonnées uniquement, aucun téléchargement de données"
          } >> "$GITHUB_STEP_SUMMARY"
