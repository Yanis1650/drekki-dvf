name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Lint
        run: ruff check app data-pipeline tests
      # Perimetre volontairement etroit : domaine, infrastructure et schemas
      # passent le mode strict. Le reste du paquet ne le passe pas encore, et
      # une configuration stricte qu'on n'execute pas est un faux signal.
      # Voir la section [tool.mypy] de pyproject.toml.
      - name: Types (mypy, perimetre strict)
        run: mypy app/domain app/infrastructure app/schemas
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend · Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Check visual charter
        run: npm run check:charte
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Store frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Containers · production build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose topology
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build --tag foncier-express-backend:ci --file Dockerfile.backend .
      - name: Build frontend image
        run: docker build --tag foncier-express-frontend:ci --file Dockerfile.frontend .
