# Foncier-Express - Déploiement production
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# L'application est entièrement libre et sans compte : plus de base
# transactionnelle (PostgreSQL/PostGIS), plus de crédits, plus de paiement.
# Il ne reste qu'un backend en lecture seule sur un fichier DuckDB, et un
# frontend statique servi par nginx.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: foncier-backend
    environment:
      # Base analytique montée en lecture seule depuis ./data
      DUCKDB_PATH: /app/data/dept35.duckdb
      DATA_DIR: /app/data
      MULTI_DEPT: "false"
      # Restreindre aux origines réelles en production, ex. https://mondomaine.fr
      CORS_ALLOW_ORIGINS: "*"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    # 2 workers + Chromium (génération PDF)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: foncier-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
