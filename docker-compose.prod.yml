# Foncier-Express - Déploiement production
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# L'application est entièrement libre et sans compte : plus de base
# transactionnelle (PostgreSQL/PostGIS), plus de crédits, plus de paiement.
# Il ne reste qu'un backend en lecture seule sur un fichier DuckDB, et un
# frontend statique servi par nginx.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: foncier-backend
    environment:
      # Base analytique montée en lecture seule depuis ./data
      DUCKDB_PATH: /app/data/dept35.duckdb
      DATA_DIR: /app/data
      MULTI_DEPT: "false"
      # Restriction par défaut au domaine public ; surchargeable via .env.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://foncier-express.drekky.fr}
      # Bornes DuckDB, par worker (app/infrastructure/duckdb_settings.py).
      # Sans elles, chacun des 2 workers s'autorisait 3,1 Go et 6 fils : leur
      # somme depassait la limite du conteneur. 2 x 1 Go laissent la place a
      # Python et au Chromium des PDF sous les 4 Go (mesure le 05/10/2026 :
      # 2,7 Go au plus sous 4 recherches a 5 km, 2 couches et 1 PDF a la fois).
      DUCKDB_MEMORY_LIMIT: 1GB
      DUCKDB_THREADS: "3"
      DUCKDB_TEMP_DIRECTORY: /tmp/duckdb
      DUCKDB_MAX_TEMP_DIRECTORY_SIZE: 2GB
      # Les endpoints synchrones tournent dans un pool de fils : sans borne,
      # glibc ouvre une arene memoire par fil et garde la memoire des grosses
      # reponses. 2 arenes : ~10 % de memoire en moins apres une charge.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    # 2 workers + Chromium (génération PDF). Le serveur héberge d'autres
    # sites : 3 coeurs au plus sur 6 (1 pour les autres backends). A 2, la
    # couche des parcelles, rechargee a chaque deplacement de la carte,
    # passait de 0,9 s a 1,8 s ; a 3, 1,1 a 1,3 s.
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "3.0"
        reservations:
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: foncier-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:80:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
