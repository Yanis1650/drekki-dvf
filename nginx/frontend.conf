# Foncier-Express - Frontend Nginx (SPA + API proxy)

# Limite de debit par visiteur. L'API est publique et sans compte : sans elle,
# n'importe qui pouvait enchainer recherches de 50 000 ventes et PDF (un
# Chromium chacun). 10 requetes/s couvrent largement une carte qu'on deplace ;
# les rapports PDF, eux, sont limites a 6 par minute.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rapports:1m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Adresse reelle du visiteur. nginx ne voit que Traefik : on la lit dans
    # X-Forwarded-For, que Traefik reecrit (verifie le 05/10/2026 : une
    # valeur falsifiee par le client est remplacee par sa vraie adresse).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Ne pas annoncer la version de nginx.
    server_tokens off;
    include /etc/nginx/snippets/en-tetes-securite.conf;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # API proxy -> Backend FastAPI
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Rapports (PDF de parcelle et de mutation) : un Chromium par demande.
    location ~ ^/api/v1/(reports|land/report)/ {
        limit_req zone=rapports burst=3 nodelay;
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Health / docs
    location /health { proxy_pass http://backend:8000/health; }
    location /docs { proxy_pass http://backend:8000/docs; proxy_redirect off; }
    location /redoc { proxy_pass http://backend:8000/redoc; proxy_redirect off; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    # SPA: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/en-tetes-securite.conf;
    }

    # Fichiers produits par Vite (noms hashes) : un fichier absent est une 404,
    # jamais index.html. Le repli SPA servait la page d'accueil a la place du
    # worker MapLibre, ce qui cassait la carte sans aucune erreur visible.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/en-tetes-securite.conf;
    }

    # Static assets: cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/en-tetes-securite.conf;
    }
}
