# En-tetes de securite, inclus dans `server` ET dans chaque `location` qui
# pose son propre add_header : nginx n'herite des add_header du niveau
# superieur que si le bloc n'en declare aucun.
#
# Pas de Content-Security-Policy pour l'instant : elle doit etre eprouvee sur
# toutes les vues (carte, marche, dossiers, PDF) avant d'etre posee.
add_header X-Content-Type-Options "nosniff" always;
# Aucun site ne l'affiche en iframe (le portfolio n'en fait qu'un lien).
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
