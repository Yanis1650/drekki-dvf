[project]
name = "foncier-express"
version = "0.1.0"
description = "Analyse foncière DVF avec méthodologie Mericskay"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Foncier-Express Contributors" }
]
keywords = ["foncier", "dvf", "immobilier", "cadastre", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "polars>=0.20.0",
    "duckdb>=0.9.2",
    "geopandas>=0.14.0",
    "fiona>=1.9.0",
    "osmnx>=1.9.0",
    "shapely>=2.0.2",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.8.0",
    "playwright>=1.40.0",
    "reportlab>=4.0.0",
    "pyproj>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
# 120 plutôt que 100 : l'essentiel des dépassements sont des requêtes SQL
# multi-lignes et des messages de log, que couper nuirait à la lisibilité.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # `class X(str, Enum)` -> `StrEnum` change la valeur de str(X.A) et donc
    # la sérialisation. Migration à faire délibérément, pas au fil du lint.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Le répertoire s'appelle data-pipeline (tiret) : il est importé via sys.path,
# jamais comme package. Le renommer casserait tous les scripts ETL.
"data-pipeline/**" = ["N999"]
# Les tests doivent bouchonner les dépendances ETL absentes avant d'importer
# les modules testés : les imports ne peuvent pas être en tête de fichier.
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app", "data-pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
