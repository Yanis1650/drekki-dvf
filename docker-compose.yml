services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: foncier-postgis
    environment:
      POSTGRES_USER: foncier
      POSTGRES_PASSWORD: foncier_2024
      POSTGRES_DB: foncier_express
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U foncier -d foncier_express" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgis_data:
